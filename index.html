<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Hand Tracking</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#10233b 0%,#040811 38%,#010207 80%);
}

/* CAMERA */
#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.88;
  filter:contrast(1.08) brightness(.78) saturate(1.15);
}

/* CANVAS */
#fx{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.55) 100%);
}

/* TOP UI */
.top{
  position:absolute;
  top:20px;
  left:20px;
  right:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
}

.logo{
  font-size:14px;
  letter-spacing:4px;
  font-weight:800;
}

.status{
  padding:8px 14px;
  border:1px solid rgba(0,255,255,.35);
  border-radius:30px;
  background:rgba(0,20,30,.55);
  backdrop-filter:blur(12px);
  color:#62ffff;
  font-size:11px;
  letter-spacing:2px;
}

/* CENTER */
.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:5;
  pointer-events:none;
}

.title{
  font-size:clamp(30px,6vw,75px);
  font-weight:900;
  letter-spacing:8px;
  text-shadow:
    0 0 10px #00ffff,
    0 0 30px rgba(0,255,255,.5);
}

.subtitle{
  margin-top:10px;
  color:#8ba7b8;
  letter-spacing:5px;
  font-size:11px;
}

/* BUTTON */
.controls{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
}

button{
  border:1px solid rgba(0,255,255,.5);
  background:rgba(0,15,25,.75);
  color:#7fffff;
  padding:14px 24px;
  border-radius:40px;
  font-weight:800;
  letter-spacing:2px;
  cursor:pointer;
  backdrop-filter:blur(15px);
  box-shadow:
    0 0 20px rgba(0,255,255,.15),
    inset 0 0 20px rgba(0,255,255,.05);
  transition:.25s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:
    0 0 35px rgba(0,255,255,.5);
}

/* INFO */
.info{
  position:absolute;
  left:20px;
  bottom:25px;
  z-index:10;
  font-size:10px;
  color:#65808e;
  letter-spacing:2px;
}

/* LOADING */
#loading{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#02040a;
  transition:.5s;
}

.loader{
  width:45px;
  height:45px;
  border:2px solid rgba(0,255,255,.15);
  border-top-color:#00ffff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:20px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.hidden{
  opacity:0;
  pointer-events:none;
}

/* MOBILE */
@media(max-width:600px){

  .top{
    top:14px;
    left:14px;
    right:14px;
  }

  .logo{
    font-size:10px;
    letter-spacing:3px;
  }

  .status{
    font-size:9px;
    padding:7px 10px;
  }

  .title{
    letter-spacing:5px;
    font-size:31px;
  }

  .subtitle{
    font-size:8px;
    letter-spacing:3px;
  }

  .controls{
    bottom:25px;
  }

  button{
    padding:13px 18px;
    font-size:10px;
  }

  .info{
    display:none;
  }
}
</style>
</head>

<body>

<div id="app">

  <video id="camera" autoplay playsinline muted></video>

  <canvas id="fx"></canvas>

  <div class="overlay"></div>

  <div class="top">
    <div class="logo">ENERGY // TRACKING</div>
    <div class="status" id="status">OFFLINE</div>
  </div>

  <div class="center">
    <div class="title">ENERGY</div>
    <div class="subtitle">HAND INTERACTION SYSTEM</div>
  </div>

  <div class="info">
    CAMERA / HAND / ENERGY CORE
  </div>

  <div class="controls">
    <button id="start">⚡ AKTIFKAN KAMERA</button>
  </div>

  <div id="loading">
    <div class="loader"></div>
    <div>MEMUAT SYSTEM...</div>
  </div>

</div>

<script type="module">

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video = document.getElementById("camera");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

const button = document.getElementById("start");
const status = document.getElementById("status");
const loading = document.getElementById("loading");

let handLandmarker;
let stream;
let lastVideoTime = -1;

let hands = [];

let particles = [];

function resize(){

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* PARTICLES */

for(let i=0;i<250;i++){

  particles.push({
    x:Math.random(),
    y:Math.random(),
    vx:(Math.random()-.5)*.001,
    vy:(Math.random()-.5)*.001,
    size:Math.random()*2+0.5,
    life:Math.random()
  });

}


/* MEDIAPIPE */

async function setup(){

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(
    vision,
    {
      baseOptions:{
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },

      runningMode:"VIDEO",

      numHands:2,

      minHandDetectionConfidence:.55,

      minHandPresenceConfidence:.55,

      minTrackingConfidence:.55
    }
  );

  loading.classList.add("hidden");

}

setup();


/* CAMERA */

button.addEventListener("click",async()=>{

  try{

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:false

    });

    video.srcObject=stream;

    await video.play();

    button.style.display="none";

    status.textContent="SYSTEM ONLINE";

    status.style.color="#00ffff";

    animate();

  }catch(error){

    console.error(error);

    status.textContent="CAMERA ERROR";

    alert(
      "Kamera tidak bisa dibuka. Pastikan izin kamera sudah diberikan."
    );

  }

});


/* LANDMARK */

function point(hand,index){

  const p=hand[index];

  return {

    x:(1-p.x)*canvas.width,

    y:p.y*canvas.height

  };

}


/* DISTANCE */

function distance(a,b){

  return Math.sqrt(

    Math.pow(a.x-b.x,2)+

    Math.pow(a.y-b.y,2)

  );

}


/* GLOW */

function glowCircle(x,y,r){

  const g=ctx.createRadialGradient(
    x,y,0,
    x,y,r
  );

  g.addColorStop(0,"rgba(255,255,255,.95)");

  g.addColorStop(.08,"rgba(0,255,255,.9)");

  g.addColorStop(.35,"rgba(0,150,255,.35)");

  g.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(x,y,r,0,Math.PI*2);

  ctx.fill();

}


/* ENERGY BEAM */

function beam(a,b){

  const d=distance(a,b);

  const gradient=ctx.createLinearGradient(
    a.x,a.y,b.x,b.y
  );

  gradient.addColorStop(
    0,
    "rgba(0,255,255,0)"
  );

  gradient.addColorStop(
    .5,
    "rgba(0,255,255,.8)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,100,255,0)"
  );

  ctx.strokeStyle=gradient;

  ctx.lineWidth=Math.min(15,Math.max(2,d*.04));

  ctx.shadowBlur=25;

  ctx.shadowColor="#00ffff";

  ctx.beginPath();

  ctx.moveTo(a.x,a.y);

  ctx.lineTo(b.x,b.y);

  ctx.stroke();

  ctx.shadowBlur=0;

}


/* HAND DRAW */

function drawHand(hand){

  const connections=[
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];

  ctx.lineCap="round";

  for(const [a,b] of connections){

    const p1=point(hand,a);

    const p2=point(hand,b);

    ctx.strokeStyle="rgba(0,255,255,.65)";

    ctx.lineWidth=2;

    ctx.shadowBlur=12;

    ctx.shadowColor="#00ffff";

    ctx.beginPath();

    ctx.moveTo(p1.x,p1.y);

    ctx.lineTo(p2.x,p2.y);

    ctx.stroke();

  }

  ctx.shadowBlur=0;

  for(let i=0;i<21;i++){

    const p=point(hand,i);

    glowCircle(p.x,p.y,9);

  }

}


/* ENERGY CORE */

function energyCore(a,b){

  const x=(a.x+b.x)/2;

  const y=(a.y+b.y)/2;

  const d=distance(a,b);

  const radius=Math.max(
    25,
    Math.min(130,d*.35)
  );

  /* outer glow */

  for(let i=0;i<3;i++){

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      radius+i*12,
      0,
      Math.PI*2
    );

    ctx.strokeStyle=
      `rgba(0,255,255,${.25-i*.06})`;

    ctx.lineWidth=2;

    ctx.shadowBlur=30;

    ctx.shadowColor="#00ffff";

    ctx.stroke();

  }

  ctx.shadowBlur=0;

  /* core */

  glowCircle(x,y,radius*1.5);

  /* rings */

  const time=Date.now()/700;

  for(let i=0;i<5;i++){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
      time*(i%2?-.7:.7)+i
    );

    ctx.strokeStyle=
      `rgba(0,255,255,${.55-i*.07})`;

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      radius+i*7,
      radius*.35+i*4,
      0,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

  }

  /* rays */

  for(let i=0;i<20;i++){

    const angle=
      Math.PI*2*i/20+time;

    const inner=radius*.8;

    const outer=
      radius+
      15+
      Math.sin(time*3+i)*15;

    ctx.strokeStyle=
      "rgba(0,220,255,.35)";

    ctx.beginPath();

    ctx.moveTo(
      x+Math.cos(angle)*inner,
      y+Math.sin(angle)*inner
    );

    ctx.lineTo(
      x+Math.cos(angle)*outer,
      y+Math.sin(angle)*outer
    );

    ctx.stroke();

  }

}


/* PARTICLES */

function drawParticles(){

  for(const p of particles){

    p.x+=p.vx;

    p.y+=p.vy;

    if(p.x<0)p.x=1;

    if(p.x>1)p.x=0;

    if(p.y<0)p.y=1;

    if(p.y>1)p.y=0;

    const x=p.x*canvas.width;

    const y=p.y*canvas.height;

    ctx.fillStyle=
      "rgba(0,220,255,.4)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* MAIN LOOP */

async function animate(){

  requestAnimationFrame(animate);

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawParticles();

  if(
    handLandmarker &&
    video.readyState>=2 &&
    video.currentTime!==lastVideoTime
  ){

    lastVideoTime=video.currentTime;

    const result=
      handLandmarker.detectForVideo(
        video,
        performance.now()
      );

    hands=result.landmarks||[];

    for(const hand of hands){

      drawHand(hand);

    }

    if(hands.length===2){

      const h1=hands[0];

      const h2=hands[1];

      const palm1=point(h1,9);

      const palm2=point(h2,9);

      beam(palm1,palm2);

      energyCore(
        palm1,
        palm2
      );

      status.textContent=
        "TWO HANDS // ENERGY ACTIVE";

    }else if(hands.length===1){

      status.textContent=
        "HAND DETECTED";

      const palm=point(
        hands[0],
        9
      );

      glowCircle(
        palm.x,
        palm.y,
        55
      );

    }else{

      status.textContent=
        "SEARCHING HAND...";

    }

  }

}

</script>

</body>
</html>
