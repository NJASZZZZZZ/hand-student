<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Hand Energy Tracking</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    background:#000;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.ui{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    width:calc(100% - 36px);
    max-width:430px;
    padding:15px 18px;
    color:white;
    text-align:center;
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 0 30px rgba(0,180,255,.18);
}

.ui h1{
    font-size:16px;
    letter-spacing:3px;
}

#status{
    margin-top:7px;
    color:#6eeaff;
    font-size:12px;
}

#start{
    position:fixed;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    z-index:30;
    border:1px solid rgba(100,230,255,.6);
    border-radius:50px;
    padding:15px 28px;
    color:white;
    background:rgba(0,100,160,.35);
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:0 0 25px rgba(0,210,255,.35);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

#start:active{
    transform:translateX(-50%) scale(.95);
}

#error{
    position:fixed;
    left:18px;
    right:18px;
    bottom:105px;
    z-index:25;
    display:none;
    padding:14px;
    color:#fff;
    background:rgba(100,0,0,.7);
    border:1px solid rgba(255,100,100,.4);
    border-radius:14px;
    font-size:12px;
    line-height:1.5;
    text-align:center;
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline webkit-playsinline></video>
<canvas id="canvas"></canvas>

<div class="ui">
    <h1>ENERGY TRACKING</h1>
    <p id="status">READY</p>
</div>

<div id="error"></div>

<button id="start">⚡ AKTIFKAN KAMERA</button>

<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video=document.getElementById("camera");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");
const startButton=document.getElementById("start");
const errorBox=document.getElementById("error");

let handLandmarker=null;
let lastVideoTime=-1;
let running=false;

function resize(){

    canvas.width=window.innerWidth*devicePixelRatio;
    canvas.height=window.innerHeight*devicePixelRatio;

    canvas.style.width=window.innerWidth+"px";
    canvas.style.height=window.innerHeight+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

window.addEventListener("resize",resize);
resize();

function showError(message){

    errorBox.style.display="block";
    errorBox.textContent=message;
}

async function setup(){

    try{

        statusText.textContent="MEMUAT HAND TRACKING...";

        const vision=
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
            );

        handLandmarker=
            await HandLandmarker.createFromOptions(
                vision,
                {
                    baseOptions:{
                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
                    },

                    runningMode:"VIDEO",
                    numHands:2,

                    minHandDetectionConfidence:.55,
                    minHandPresenceConfidence:.55,
                    minTrackingConfidence:.55
                }
            );

        statusText.textContent="HAND TRACKING SIAP";

    }catch(error){

        console.error(error);

        statusText.textContent="GAGAL MEMUAT";

        showError(
            "MediaPipe gagal dimuat. Pastikan internet aktif."
        );
    }
}

async function startCamera(){

    errorBox.style.display="none";

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error("CAMERA_API_NOT_SUPPORTED");
        }

        statusText.textContent="MEMINTA IZIN KAMERA...";

        const stream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false
            });

        video.srcObject=stream;

        await video.play();

        running=true;

        startButton.style.display="none";

        statusText.textContent=
            "KAMERA AKTIF • TUNJUKKAN TANGAN";

        requestAnimationFrame(loop);

    }catch(error){

        console.error(error);

        if(error.name==="NotAllowedError"){

            statusText.textContent="IZIN KAMERA DITOLAK";

            showError(
                "Izinkan akses kamera untuk browser yang digunakan."
            );

        }else if(error.name==="NotFoundError"){

            statusText.textContent="KAMERA TIDAK DITEMUKAN";

            showError(
                "iPhone tidak menemukan kamera."
            );

        }else if(error.name==="NotReadableError"){

            statusText.textContent="KAMERA SEDANG DIPAKAI";

            showError(
                "Tutup aplikasi lain yang sedang menggunakan kamera."
            );

        }else{

            statusText.textContent="KAMERA GAGAL";

            showError(
                "Preview Koder mungkin tidak mendukung kamera. Gunakan HTTPS."
            );
        }
    }
}

startButton.addEventListener("click",async()=>{

    if(!handLandmarker){
        await setup();
    }

    await startCamera();

});

function point(p){

    return{
        x:(1-p.x)*window.innerWidth,
        y:p.y*window.innerHeight
    };
}

const connections=[

    [0,1],[1,2],[2,3],[3,4],

    [0,5],[5,6],[6,7],[7,8],

    [0,9],[9,10],[10,11],[11,12],

    [0,13],[13,14],[14,15],[15,16],

    [0,17],[17,18],[18,19],[19,20],

    [5,9],
    [9,13],
    [13,17]
];

function drawHand(points){

    ctx.save();

    ctx.lineWidth=3;

    ctx.shadowBlur=18;
    ctx.shadowColor="#ff7b00";

    ctx.strokeStyle="#ff9d18";

    for(const [a,b] of connections){

        const p1=point(points[a]);
        const p2=point(points[b]);

        ctx.beginPath();

        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);

        ctx.stroke();
    }

    for(const p of points){

        const q=point(p);

        ctx.beginPath();

        ctx.shadowBlur=20;
        ctx.shadowColor="#ffb000";

        ctx.fillStyle="#ffd36b";

        ctx.arc(
            q.x,
            q.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}

function drawEnergy(x,y,time){

    const pulse=
        1+Math.sin(time*.006)*.1;

    const radius=65*pulse;

    const glow=
        ctx.createRadialGradient(
            x,y,0,
            x,y,radius*2.2
        );

    glow.addColorStop(
        0,
        "rgba(255,255,255,.95)"
    );

    glow.addColorStop(
        .15,
        "rgba(100,220,255,.9)"
    );

    glow.addColorStop(
        .45,
        "rgba(40,150,255,.35)"
    );

    glow.addColorStop(
        1,
        "rgba(0,80,255,0)"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius*2.2,
        0,
        Math.PI*2
    );

    ctx.fill();

    const core=
        ctx.createRadialGradient(
            x-radius*.2,
            y-radius*.2,
            2,
            x,
            y,
            radius
        );

    core.addColorStop(0,"white");
    core.addColorStop(.2,"#d9ffff");
    core.addColorStop(.5,"#5bdcff");
    core.addColorStop(1,"rgba(0,100,255,0)");

    ctx.fillStyle=core;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.save();

    ctx.translate(x,y);

    for(let i=0;i<5;i++){

        ctx.rotate(
            time*.0005*(i+1)
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            radius*(1.1+i*.15),
            radius*(.35+i*.05),
            0,
            0,
            Math.PI*2
        );

        ctx.strokeStyle=
            `rgba(120,230,255,${.35-i*.05})`;

        ctx.lineWidth=2;

        ctx.shadowBlur=20;
        ctx.shadowColor="#00d9ff";

        ctx.stroke();
    }

    ctx.restore();

    for(let i=0;i<22;i++){

        const angle=
            time*.002+i*.8;

        const r=
            radius+
            Math.sin(time*.004+i)*25+
            15;

        const sx=
            x+Math.cos(angle)*r;

        const sy=
            y+Math.sin(angle)*r;

        ctx.beginPath();

        ctx.fillStyle=
            "rgba(190,245,255,.9)";

        ctx.shadowBlur=15;
        ctx.shadowColor="#00d9ff";

        ctx.arc(
            sx,
            sy,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function lightning(
    x1,
    y1,
    x2,
    y2,
    time
){

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    const segments=8;

    for(let i=1;i<=segments;i++){

        const t=i/segments;

        let x=
            x1+(x2-x1)*t;

        let y=
            y1+(y2-y1)*t;

        const offset=
            Math.sin(
                time*.02+i*7
            )*8;

        x+=offset;
        y-=offset;

        ctx.lineTo(x,y);
    }

    ctx.strokeStyle=
        "rgba(90,220,255,.8)";

    ctx.lineWidth=1.5;

    ctx.shadowBlur=15;
    ctx.shadowColor="#00cfff";

    ctx.stroke();

    ctx.restore();
}

function loop(time){

    if(
        !running ||
        !handLandmarker ||
        video.readyState<2
    ){

        requestAnimationFrame(loop);
        return;
    }

    if(lastVideoTime!==video.currentTime){

        const result=
            handLandmarker.detectForVideo(
                video,
                performance.now()
            );

        lastVideoTime=
            video.currentTime;

        ctx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );

        if(
            result.landmarks &&
            result.landmarks.length
        ){

            statusText.textContent=
                result.landmarks.length+
                " HAND DETECTED";

            for(
                const hand
                of result.landmarks
            ){

                drawHand(hand);

                const wrist=
                    point(hand[0]);

                const index=
                    point(hand[5]);

                const pinky=
                    point(hand[17]);

                const palmX=
                    (
                        wrist.x+
                        index.x+
                        pinky.x
                    )/3;

                const palmY=
                    (
                        wrist.y+
                        index.y+
                        pinky.y
                    )/3;

                const energyX=
                    palmX;

                const energyY=
                    palmY-70;

                drawEnergy(
                    energyX,
                    energyY,
                    time
                );

                for(
                    const id
                    of [4,8,12,16,20]
                ){

                    const finger=
                        point(hand[id]);

                    lightning(
                        energyX,
                        energyY,
                        finger.x,
                        finger.y,
                        time
                    );
                }
            }

        }else{

            statusText.textContent=
                "SHOW YOUR HAND";
        }
    }

    requestAnimationFrame(loop);
}

setup();

</script>

</body>
</html>
